name: Build APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Swap Space (prevent OOM crashes)
      run: |
        sudo swapoff /swapfile || true
        sudo rm -f /swapfile
        sudo dd if=/dev/zero of=/swapfile bs=1M count=4096 status=none
        sudo chmod 600 /swapfile
        sudo mkswap /swapfile
        sudo swapon /swapfile
        free -h

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          git \
          python3-dev \
          ffmpeg \
          libsdl2-dev \
          libsdl2-image-dev \
          libsdl2-mixer-dev \
          libsdl2-ttf-dev \
          libportmidi-dev \
          libswscale-dev \
          libavformat-dev \
          libavcodec-dev \
          zlib1g-dev \
          zip \
          unzip \
          autoconf \
          libtool \
          pkg-config \
          openjdk-17-jdk \
          libffi-dev \
          libltdl-dev \
          libssl-dev \
          libsqlite3-dev

    - name: Install Buildozer and Cython
      run: |
        pip install --upgrade pip
        pip install Cython==3.0.11 buildozer

    - name: Manual Setup Android NDK r25b
      run: |
        mkdir -p /home/runner/.buildozer/android/platform
        cd /home/runner/.buildozer/android/platform
        
        if [ ! -d "android-ndk-r25b" ]; then
          echo "Pobieranie NDK r25b..."
          wget -q https://dl.google.com/android/repository/android-ndk-r25b-linux.zip
          unzip -q android-ndk-r25b-linux.zip
          rm android-ndk-r25b-linux.zip
        fi
        rm -rf android-ndk
        mv android-ndk-r25b android-ndk

    - name: Cache Buildozer directory
      uses: actions/cache@v4
      with:
        path: .buildozer
        key: ${{ runner.os }}-buildozer-v28-${{ hashFiles('buildozer.spec') }}-${{ hashFiles('.github/workflows/build.yml') }}
        restore-keys: |
          ${{ runner.os }}-buildozer-

    - name: Build with Buildozer
      run: |
        # Czyszczenie testów Pythona w tle, aby oszczędzić pamięć RAM
        (while true; do
          find .buildozer/ -type d -name "test" -exec rm -rf {} + 2>/dev/null || true
          sleep 2
        done) &
        WATCHER_PID=$!

        buildozer -v android debug || (echo "=== BŁĄD KOMPILACJI - OSTATNIE LINIE LOGU ===" && tail -n 100 .buildozer/*.log || true) && exit 1

        kill $WATCHER_PID 2>/dev/null || true

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: pakiet-apk
        path: bin/*.apk
