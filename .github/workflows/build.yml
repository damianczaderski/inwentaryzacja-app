name: Build APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Cache Buildozer directory
      uses: actions/cache@v4
      with:
        path: .buildozer
        key: ${{ runner.os }}-buildozer-v4-${{ hashFiles('buildozer.spec') }}-${{ hashFiles('.github/workflows/build.yml') }}
        restore-keys: |
          ${{ runner.os }}-buildozer-

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          git \
          python3-dev \
          ffmpeg \
          libsdl2-dev \
          libsdl2-image-dev \
          libsdl2-mixer-dev \
          libsdl2-ttf-dev \
          libportmidi-dev \
          libswscale-dev \
          libavformat-dev \
          libavcodec-dev \
          zlib1g-dev \
          libgstreamer1.0-dev \
          gstreamer1.0-plugins-base \
          gstreamer1.0-plugins-good \
          zip \
          unzip \
          autoconf \
          libtool \
          pkg-config \
          openjdk-17-jdk \
          libffi-dev \
          libltdl-dev \
          libssl-dev \
          libsqlite3-dev

    - name: Install Buildozer and Cython
      run: |
        pip install --upgrade pip
        pip install Cython==0.29.36 buildozer

    - name: Build with Buildozer (with Python test cleaner)
      run: |
        # Uruchomienie skryptu w tle, który na bieżąco wycina folder testów Pythona, zapobiegając brakowi pamięci (OOM)
        (while true; do
          rm -rf .buildozer/android/platform/build-arm64-v8a/build/other_builds/python3/*/python3/android-build-root/lib/python3.11/test 2>/dev/null || true
          rm -rf .buildozer/android/platform/build-arm64-v8a/build/other_builds/python3/*/python3/android-build-root/lib/python3.11/*/test 2>/dev/null || true
          sleep 1
        done) &
        WATCHER_PID=$!

        # Właściwe budowanie
        buildozer -v android debug || (echo "=== BŁĄD KOMPILACJI - OSTATNIE LINIE LOGU ===" && tail -n 100 .buildozer/*.log || true) && exit 1

        # Wyłączenie skryptu czyszczącego po zakończeniu
        kill $WATCHER_PID 2>/dev/null || true

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: pakiet-apk
        path: bin/*.apk
